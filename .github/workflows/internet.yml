name: Aggiorna offerte internet

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  internet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/internet.py
      - run: python scripts/loghi.py
      - run: python scripts/pagine.py && python scripts/csp.py
      - name: Pubblica
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/internet.json data/internet_auto.json data/luce.json data/gas.json data/dual.json img/loghi internet/ luce-e-gas/
          git diff --cached --quiet && exit 0
          git commit -m "Offerte internet $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
