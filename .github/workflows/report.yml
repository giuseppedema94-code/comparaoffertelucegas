name: Riepilogo statistiche
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  mail:
    runs-on: ubuntu-latest
    env:
      GC_TOKEN: ${{ secrets.GC_TOKEN }}
      CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
      GA_PROPERTY: ${{ secrets.GA_PROPERTY }}
      GA_KEY: ${{ secrets.GA_KEY }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: giuseppedema94@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze Google Analytics e Search Console
        if: ${{ env.GA_KEY != '' }}
        run: pip install google-analytics-data google-auth requests
      - name: Invia riepilogo
        run: python scripts/report.py
