name: Aggiorna offerte

# Il Portale Offerte non risponde ai server di GitHub (403). I file open data li scarica
# il PC di casa (scripts/scarica-open-data.ps1) e li carica nel ramo "dati-grezzi":
# ogni caricamento avvia questo workflow, che calcola data/luce.json e data/gas.json.

on:
  push:
    branches: [dati-grezzi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: dati-grezzi
          path: grezzi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install "git+https://github.com/marcopa84/PortaleOfferteEnergiaMCP"
      - name: Genera JSON
        run: python scripts/aggiorna.py grezzi
      - name: Pubblica
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/luce.json data/gas.json
          git diff --cached --quiet && exit 0
          git commit -m "Offerte aggiornate $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
