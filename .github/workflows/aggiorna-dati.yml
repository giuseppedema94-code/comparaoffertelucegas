name: Aggiorna offerte

# Il Portale Offerte non risponde ai server di GitHub (USA): i file passano dal relay
# a Milano (Google Cloud Run, repo po-relay). Segreti richiesti: RELAY_URL, RELAY_KEY.

on:
  schedule:
    # 00:00 e 12:00 ora italiana (UTC+1 d'inverno, UTC+2 d'estate)
    - cron: "5 23 * * *"
    - cron: "5 11 * * *"
    - cron: "5 22 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install "git+https://github.com/marcopa84/PortaleOfferteEnergiaMCP"
      - name: Scarica open data (relay Milano)
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python scripts/scarica_po.py grezzi
      - name: Genera JSON
        run: python scripts/aggiorna.py grezzi
        env:
          CONTROLLA_LINK: "1"
      - name: Loghi fornitori
        run: pip install -q pillow cairosvg && python scripts/loghi.py
      - name: Pagine statiche
        run: python scripts/pagine.py && python scripts/csp.py
      - name: Pubblica
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/luce.json data/gas.json data/dual.json data/top.json data/storico img/loghi -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Offerte aggiornate $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
